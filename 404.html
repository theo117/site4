    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;

        color: #1e1d20;

      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;

      }

      a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 4px;

    <script>
      window.location.replace("/");

    <main>
      <div>
